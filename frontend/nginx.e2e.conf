server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # A missing chunk must 404 rather than return the SPA HTML.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass       http://backend:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA page; without this nginx redirects to the proxied /analytics/
    location = /analytics {
        try_files /index.html =404;
    }

    # Analytics service, resolved lazily so nginx starts without it
    location /analytics/ {
        resolver 127.0.0.11 valid=30s;
        set $analytics_upstream http://python-service:8001;
        proxy_pass       $analytics_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
