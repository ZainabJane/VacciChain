server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Development Security Headers
    # Content Security Policy - Allows inline for React development
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://horizon-testnet.stellar.org https://soroban-testnet.stellar.org https://horizon.stellar.org https://soroban.stellar.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "DENY" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Enable browser XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Permissions Policy - Restrict browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Health check endpoint for ECS container health check and target-group checks.
    # Returns 200 only when the static site is actually being served (index.html present),
    # so failed readiness removes the task from traffic without masking process crashes.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =503;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ready {
        access_log off;
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =503;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}