server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Production Security Headers
    # Content Security Policy - Restricts resource loading to prevent XSS
    # Stricter policy for production (no unsafe-inline, no unsafe-eval)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://horizon-testnet.stellar.org https://soroban-testnet.stellar.org https://horizon.stellar.org https://soroban.stellar.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "DENY" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Enable browser XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Enforce HTTPS for 1 year (31536000 seconds)
    # Only enable this after confirming HTTPS is working properly
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Permissions Policy - Restrict browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # A missing chunk must 404 rather than return the SPA HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # Container/target-group health check endpoint.
    # Served directly by nginx (never proxied) so it reflects the frontend
    # process being alive and able to serve traffic, independent of backend
    # dependency readiness. Returns 200 only when the static assets are present.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =503;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location /vaccination/ {
        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location /verify/ {
        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # SPA page; without this nginx redirects to the proxied /analytics/
    location = /analytics {
        try_files /index.html =404;
    }

    # Analytics service, resolved lazily so nginx starts without it
    location /analytics/ {
        resolver 127.0.0.11 valid=30s;
        set $analytics_upstream http://python-service:8001;
        proxy_pass       $analytics_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
