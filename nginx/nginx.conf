gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /v1/ {
        proxy_pass       http://backend:4000;
        proxy_set_header Host              $host;
        # Overwrite (not append) client-supplied forwarding headers so that
        # spoofed values from untrusted clients cannot bypass rate limits or
        # corrupt audit attribution. nginx is the single trusted hop in front
        # of the backend, so the backend must trust exactly one proxy.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # SPA page; without this nginx redirects to the proxied /analytics/
    location = /analytics {
        try_files /index.html =404;
    }

    # Python analytics service
    location /analytics/ {
        proxy_pass       http://python-service:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}