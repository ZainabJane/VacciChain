name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to staging environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.vaccichain.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/vaccichain-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/vaccichain-backend:staging-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/vaccichain-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/vaccichain-frontend:staging-latest

      - name: Build and push python-service image
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/vaccichain-python:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/vaccichain-python:staging-latest

      - name: Update ECS task definition — backend
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: staging/task-definition-backend.json
          container-name: backend
          image: ${{ steps.login-ecr.outputs.registry }}/vaccichain-backend:${{ github.sha }}

      - name: Update ECS task definition — frontend
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ steps.login-ecr.outputs.registry }}/vaccichain-frontend:${{ github.sha }}

      - name: Update ECS task definition — python-service
        id: task-def-final
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          container-name: python-service
          image: ${{ steps.login-ecr.outputs.registry }}/vaccichain-python:${{ github.sha }}

      - name: Deploy to ECS and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-final.outputs.task-definition }}
          service: vaccichain-staging
          cluster: vaccichain-staging
          wait-for-service-stability: true

      - name: Smoke test — analytics-to-backend via private service discovery
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECS_CLUSTER: vaccichain-staging
          BACKEND_SERVICE_DISCOVERY_URL: ${{ vars.STAGING_BACKEND_SERVICE_DISCOVERY_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_SERVICE_DISCOVERY_URL:-}" ]; then
            echo "::error::STAGING_BACKEND_SERVICE_DISCOVERY_URL is not set; refusing to smoke test against an unknown endpoint."
            exit 1
          fi

          case "$BACKEND_SERVICE_DISCOVERY_URL" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*"[::1]"*)
              echo "::error::Backend URL resolves to loopback ($BACKEND_SERVICE_DISCOVERY_URL); analytics must use private service discovery."
              exit 1
              ;;
          esac

          echo "Running isolated analytics smoke test against: $BACKEND_SERVICE_DISCOVERY_URL"

          # Launch a one-off task from the analytics task definition in the private
          # subnets so it resolves the backend via Cloud Map private DNS.
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition vaccichain-analytics-staging \
            --launch-type FARGATE \
            --network-configuration 'awsvpcConfiguration={subnets='"${{ vars.STAGING_PRIVATE_SUBNETS }}"',securityGroups='"${{ vars.STAGING_ANALYTICS_SMOKE_SG }}"',assignPublicIp=DISABLED}' \
            --overrides '{
              "containerOverrides": [{
                "name": "analytics",
                "command": ["python", "-m", "analytics.smoke_test", "--backend-url", "'"$BACKEND_SERVICE_DISCOVERY_URL"'"],
                "environment": [{"name": "BACKEND_URL", "value": "'"$BACKEND_SERVICE_DISCOVERY_URL"'"}]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to launch analytics smoke test task."
            exit 1
          fi

          echo "Waiting for smoke test task $TASK_ARN to stop..."
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          echo "Smoke test exit code: $EXIT_CODE (reason: $STOPPED_REASON)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Analytics smoke test failed: analytics could not reach backend at $BACKEND_SERVICE_DISCOVERY_URL (exit $EXIT_CODE)."
            exit 1
          fi

          echo "Analytics-to-backend connectivity verified via private service discovery."

      - name: Post deployment summary
        run: |
          echo "### Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://staging.vaccichain.example.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

      - name: Alert on deployment failure
        if: failure()
        run: |
          curl -sf -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 Staging deployment failed for commit `${{ github.sha }}` by `${{ github.actor }}`. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

  smoke-tests:
    name: Staging smoke tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.vaccichain.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Frontend route load
        run: |
          set -euo pipefail
          for route in "/" "/verify" "/login"; do
            echo "Checking frontend route: ${route}"
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --retry 5 --retry-delay 5 --retry-connrefused --max-time 30 \
              "https://staging.vaccichain.example.com${route}")
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 400 ]; then
              echo "::error::Frontend route ${route} returned HTTP ${status}"
              exit 1
            fi
          done

      - name: Backend API health
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-connrefused --max-time 30 \
            "https://staging.vaccichain.example.com/api/health")
          if [ "${status}" -ne 200 ]; then
            echo "::error::API health endpoint returned HTTP ${status}"
            exit 1
          fi
          body=$(curl -sf --max-time 30 "https://staging.vaccichain.example.com/api/health")
          echo "Health response: ${body}"
          echo "${body}" | grep -qi '"status"[[:space:]]*:[[:space:]]*"ok"' || {
            echo "::error::API health response did not report status ok"
            exit 1
          }

      - name: Analytics reachability
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-connrefused --max-time 30 \
            "https://staging.vaccichain.example.com/api/analytics/health")
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 400 ]; then
            echo "::error::Analytics endpoint returned HTTP ${status}"
            exit 1
          fi

      - name: Public verification (safe test case)
        run: |
          set -euo pipefail
          test_wallet="${STAGING_TEST_WALLET:-0x0000000000000000000000000000000000000000}"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 5 --retry-connrefused --max-time 30 \
            "https://staging.vaccichain.example.com/verify/public/${test_wallet}")
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 400 ]; then
            echo "::error::Public verification endpoint returned HTTP ${status}"
            exit 1
          fi
        env:
          STAGING_TEST_WALLET: ${{ secrets.STAGING_TEST_WALLET }}

      - name: Post smoke test summary
        if: always()
        run: |
          echo "### Staging Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Result:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

      - name: Alert on smoke test failure
        if: failure()
        run: |
          curl -sf -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 Staging smoke tests failed for commit `${{ github.sha }}` by `${{ github.actor }}`. Production promotion is blocked. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
