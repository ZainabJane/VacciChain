name: Deploy Contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: testnet
        type: choice
        options: [testnet, mainnet]

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    outputs:
      wasm-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Build WASM
        working-directory: contracts
        run: make build

      - name: Hash artifact
        id: hash
        run: echo "hash=$(sha256sum contracts/target/wasm32-unknown-unknown/release/vaccichain.wasm | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vaccichain-wasm
          path: contracts/target/wasm32-unknown-unknown/release/vaccichain.wasm
          retention-days: 7

  deploy-testnet:
    name: Deploy → Testnet
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.network == 'testnet')
    environment:
      name: testnet
      url: https://stellar.expert/explorer/testnet/contract/${{ steps.deploy.outputs.contract_id }}
    outputs:
      contract_id: ${{ steps.deploy.outputs.contract_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vaccichain-wasm
          path: contracts/target/wasm32-unknown-unknown/release/

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-v22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Deploy contract
        id: deploy
        env:
          ADMIN_SECRET_KEY: ${{ secrets.TESTNET_ADMIN_SECRET_KEY }}
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/vaccichain.wasm \
            --source "$ADMIN_SECRET_KEY" \
            --network testnet)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "### Testnet Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Contract ID:** \`$CONTRACT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **WASM SHA-256:** \`${{ needs.build.outputs.wasm-hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          ADMIN_SECRET_KEY: ${{ secrets.TESTNET_ADMIN_SECRET_KEY }}
          ADMIN_PUBLIC_KEY: ${{ secrets.TESTNET_ADMIN_PUBLIC_KEY }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source "$ADMIN_SECRET_KEY" \
            --network testnet \
            -- verify_vaccination \
            --wallet "$ADMIN_PUBLIC_KEY"

      - name: Write contract ID to env config
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh secret set TESTNET_CONTRACT_ID --body "$CONTRACT_ID"

      - name: Verify public TLS certificate
        env:
          PUBLIC_HOST: ${{ vars.TESTNET_PUBLIC_HOST }}
        run: |
          if [ -z "$PUBLIC_HOST" ]; then
            echo "::error::TESTNET_PUBLIC_HOST is not configured; cannot verify TLS."
            exit 1
          fi

          echo "### TLS verification for $PUBLIC_HOST" >> "$GITHUB_STEP_SUMMARY"

          # 1. Certificate chain, hostname match and expiry (fails on any error).
          if ! openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" \
              -verify_return_error -verify_hostname "$PUBLIC_HOST" </dev/null 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -checkend 604800; then
            echo "::error::Certificate chain/hostname/expiry check failed for $PUBLIC_HOST."
            exit 1
          fi
          echo "- Certificate chain, hostname and 7-day expiry window: OK" >> "$GITHUB_STEP_SUMMARY"

          # 2. Modern TLS policy: TLS 1.2+ must succeed.
          if ! openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" \
              -tls1_2 </dev/null 2>/dev/null | grep -q "Verify return code: 0 (ok)"; then
            echo "::error::TLS 1.2+ handshake failed for $PUBLIC_HOST."
            exit 1
          fi
          echo "- TLS 1.2+ handshake: OK" >> "$GITHUB_STEP_SUMMARY"

          # 3. Legacy TLS 1.0/1.1 must be rejected.
          for legacy in -tls1 -tls1_1; do
            if openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" \
                $legacy </dev/null 2>/dev/null | grep -q "Verify return code: 0 (ok)"; then
              echo "::error::Legacy TLS ($legacy) is still accepted by $PUBLIC_HOST."
              exit 1
            fi
          done
          echo "- Legacy TLS 1.0/1.1 rejected: OK" >> "$GITHUB_STEP_SUMMARY"

          # 4. Plaintext HTTP must redirect to HTTPS (or be refused).
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "http://$PUBLIC_HOST/" || echo "000")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "- Plaintext HTTP refused: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            REDIRECT_URL=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 15 "http://$PUBLIC_HOST/")
            case "$REDIRECT_URL" in
              https://*)
                echo "- Plaintext HTTP redirects to $REDIRECT_URL: OK" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "::error::Plaintext HTTP is not redirected to HTTPS (status $HTTP_CODE)."
                exit 1
                ;;
            esac
          fi

          # 5. HTTPS endpoint must be reachable with a valid certificate.
          if ! curl -sS -o /dev/null --fail --max-time 15 "https://$PUBLIC_HOST/"; then
            echo "::error::HTTPS endpoint https://$PUBLIC_HOST/ is not reachable with a valid certificate."
            exit 1
          fi
          echo "- HTTPS endpoint reachable with valid certificate: OK" >> "$GITHUB_STEP_SUMMARY"

  deploy-mainnet:
    name: Deploy → Mainnet
    needs: [build, deploy-testnet]
    runs-on: ubuntu-latest
    # Production promotion is gated on successful staging smoke tests:
    # - deploy-testnet (incl. its smoke test step) must succeed via `needs`
    # - the "Deploy to Staging" workflow must have completed successfully for
    #   this commit (checked in the first step below), so a failing staging
    #   smoke test blocks promotion even when triggered manually.
    if: github.event_name == 'workflow_dispatch' && inputs.network == 'mainnet'
    environment:
      name: mainnet
      url: https://stellar.expert/explorer/public/contract/${{ steps.deploy.outputs.contract_id }}
    outputs:
      contract_id: ${{ steps.deploy.outputs.contract_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Require successful staging smoke tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_WORKFLOW: deploy-staging.yml
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Checking latest '$STAGING_WORKFLOW' run for commit $TARGET_SHA..."
          RUN_JSON=$(gh run list \
            --workflow "$STAGING_WORKFLOW" \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json conclusion,status,headSha,databaseId)
          CONCLUSION=$(echo "$RUN_JSON" | jq -r '.[0].conclusion // "none"')
          STATUS=$(echo "$RUN_JSON" | jq -r '.[0].status // "none"')
          RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId // "none"')
          echo "Staging run: id=$RUN_ID status=$STATUS conclusion=$CONCLUSION"
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Staging smoke tests have not passed for $TARGET_SHA (status=$STATUS, conclusion=$CONCLUSION). Blocking production promotion."
            exit 1
          fi
          echo "Staging smoke tests passed for $TARGET_SHA. Proceeding with production promotion."

      - uses: actions/download-artifact@v4
        with:
          name: vaccichain-wasm
          path: contracts/target/wasm32-unknown-unknown/release/

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-v22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Deploy contract
        id: deploy
        env:
          ADMIN_SECRET_KEY: ${{ secrets.MAINNET_ADMIN_SECRET_KEY }}
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/vaccichain.wasm \
            --source "$ADMIN_SECRET_KEY" \
            --network mainnet)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "### Mainnet Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Contract ID:** \`$CONTRACT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **WASM SHA-256:** \`${{ needs.build.outputs.wasm-hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Approved by:** \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          ADMIN_SECRET_KEY: ${{ secrets.MAINNET_ADMIN_SECRET_KEY }}
          ADMIN_PUBLIC_KEY: ${{ secrets.MAINNET_ADMIN_PUBLIC_KEY }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source "$ADMIN_SECRET_KEY" \
            --network mainnet \
            -- verify_vaccination \
            --wallet "$ADMIN_PUBLIC_KEY"

      - name: Write contract ID to env config
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh secret set MAINNET_CONTRACT_ID --body "$CONTRACT_ID"

      - name: Verify public TLS certificate
        env:
          PUBLIC_HOST: ${{ vars.MAINNET_PUBLIC_HOST }}
        run: |
          if [ -z "$PUBLIC_HOST" ]; then
            echo "::error::MAINNET_PUBLIC_HOST is not configured; cannot verify TLS."
            exit 1
          fi

          echo "### TLS verification for $PUBLIC_HOST" >> "$GITHUB_STEP_SUMMARY"

          # 1. Certificate chain, hostname match and expiry (fails on any error).
          if ! openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" \
              -verify_return_error -verify_hostname "$PUBLIC_HOST" </dev/null 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -checkend 604800; then
            echo "::error::Certificate chain/hostname/expiry check failed for $PUBLIC_HOST."
            exit 1
          fi
          echo "- Certificate chain, hostname and 7-day expiry window: OK" >> "$GITHUB_STEP_SUMMARY"

          # 2. Modern TLS policy: TLS 1.2+ must succeed.
          if ! openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" \
              -tls1_2 </dev/null 2>/dev/null | grep -q "Verify return code: 0 (ok)"; then
            echo "::error::TLS 1.2+ handshake failed for $PUBLIC_HOST."
            exit 1
          fi
          echo "- TLS 1.2+ handshake: OK" >> "$GITHUB_STEP_SUMMARY"

          # 3. Legacy TLS 1.0/1.1 must be rejected.
          for legacy in -tls1 -tls1_1; do
            if openssl s_client -connect "$PUBLIC_HOST:443" -servername "$PUBLIC_HOST" \
                $legacy </dev/null 2>/dev/null | grep -q "Verify return code: 0 (ok)"; then
              echo "::error::Legacy TLS ($legacy) is still accepted by $PUBLIC_HOST."
              exit 1
            fi
          done
          echo "- Legacy TLS 1.0/1.1 rejected: OK" >> "$GITHUB_STEP_SUMMARY"

          # 4. Plaintext HTTP must redirect to HTTPS (or be refused).
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "http://$PUBLIC_HOST/" || echo "000")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "- Plaintext HTTP refused: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            REDIRECT_URL=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 15 "http://$PUBLIC_HOST/")
            case "$REDIRECT_URL" in
              https://*)
                echo "- Plaintext HTTP redirects to $REDIRECT_URL: OK" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "::error::Plaintext HTTP is not redirected to HTTPS (status $HTTP_CODE)."
                exit 1
                ;;
            esac
          fi

          # 5. HTTPS endpoint must be reachable with a valid certificate.
          if ! curl -sS -o /dev/null --fail --max-time 15 "https://$PUBLIC_HOST/"; then
            echo "::error::HTTPS endpoint https://$PUBLIC_HOST/ is not reachable with a valid certificate."
            exit 1
          fi
          echo "- HTTPS endpoint reachable with valid certificate: OK" >> "$GITHUB_STEP_SUMMARY"
