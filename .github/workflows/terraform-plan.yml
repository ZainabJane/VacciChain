name: Terraform Plan Review

on:
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.7.5'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  discover:
    name: Discover Terraform directories
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.dirs.outputs.envs }}
      modules: ${{ steps.dirs.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find environment and module directories
        id: dirs
        shell: bash
        run: |
          set -euo pipefail
          envs=$(find infra -type f -name '*.tf' -not -path '*/modules/*' -exec dirname {} \; 2>/dev/null | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          modules=$(find infra -type f -name '*.tf' -path '*/modules/*' -exec dirname {} \; 2>/dev/null | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "envs=${envs}" >> "$GITHUB_OUTPUT"
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          echo "Environment directories: ${envs}"
          echo "Module directories: ${modules}"

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra
          echo "All Terraform files are properly formatted."

  validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.envs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init -backend=false
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  validate-modules:
    name: Validate module (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init -backend=false
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  plan:
    name: Plan (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs:
      - fmt
      - validate
      - validate-modules
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.envs) }}
    environment:
      name: terraform-plan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure isolated AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          role-session-name: tf-plan-${{ github.run_id }}-${{ strategy.job-index }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -input=false

      - name: terraform plan
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ strategy.job-index }}
          path: |
            ${{ matrix.dir }}/tfplan
            ${{ matrix.dir }}/plan.txt
          retention-days: 14
          if-no-files-found: error

      - name: Post plan summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Terraform plan: \`${{ matrix.dir }}\`"
            echo '```'
            cat "${{ matrix.dir }}/plan.txt" 2>/dev/null || echo "No plan output available."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs:
      - plan
      - discover
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.envs) }}
    environment:
      name: terraform-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure isolated AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          role-session-name: tf-apply-${{ github.run_id }}-${{ strategy.job-index }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ strategy.job-index }}
          path: ${{ matrix.dir }}

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ matrix.dir }}
        run: terraform apply -input=false -auto-approve tfplan