name: CI

# Default to the most restrictive token scope; jobs opt in to extra scopes.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sunday at 00:00 UTC

jobs:
  contract:
    name: Rust / Soroban contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to sign build provenance attestations
      attestations: write  # required to publish build provenance attestations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Build WASM
        working-directory: contracts
        run: make build

      - name: Record WASM artifact hashes
        working-directory: contracts
        run: |
          mkdir -p ../wasm-artifacts
          find target -name '*.wasm' -type f -print0 | xargs -0 -r sha256sum | tee ../wasm-artifacts/SHA256SUMS

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-wasm
          path: |
            contracts/target/**/*.wasm
            wasm-artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Attest WASM build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            contracts/target/**/*.wasm
            wasm-artifacts/SHA256SUMS

      - name: Run contract tests
        working-directory: contracts
        run: cargo test

      - name: Run contract tests with coverage
        working-directory: contracts
        run: |
          cargo install cargo-tarpaulin
          make test-coverage

      - name: Upload Contract Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: contracts/tarpaulin-report.xml
          flags: contracts
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Dependency audit
        working-directory: contracts
        run: cargo audit | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-audit-report
          path: contracts/audit-report.txt

  backend:
    name: Node.js backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Run tests with coverage
        working-directory: backend
        run: npm test

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: backend/coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=high | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-audit-report
          path: backend/audit-report.txt

  frontend:
    name: Node.js frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-audit-report
          path: frontend/audit-report.txt

  python:
    name: Python analytics service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        working-directory: python-service
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: python-service
        run: flake8 .

      - name: Run tests
        working-directory: python-service
        run: pytest

      - name: Run tests with coverage
        working-directory: python-service
        run: pytest --cov --cov-report=xml

      - name: Upload Python Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: python-service/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency audit
        working-directory: python-service
        run: pip-audit -r requirements.txt | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-audit-report
          path: python-service/audit-report.txt

  # Gate job: all test jobs must pass before a PR can be merged.
  # Configure this job name ("All tests passed") as a required status check
  # in Settings → Branches → Branch protection rules for `main`.
  all-tests:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [contract, backend, frontend, python]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all test jobs succeeded
        run: |
          if [[ "${{ needs.contract.result }}" != "success" || \
                "${{ needs.backend.result }}"  != "success" || \
                "${{ needs.frontend.result }}"  != "success" || \
                "${{ needs.python.result }}"    != "success" ]]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All test jobs passed."

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to sign build provenance attestations
      attestations: write  # required to publish build provenance attestations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build ./backend -t vaccichain-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t vaccichain-frontend:ci

      - name: Build python-service image
        run: docker build ./python-service -t vaccichain-python:ci

      - name: Record container image digests
        run: |
          mkdir -p image-digests
          for image in vaccichain-backend:ci vaccichain-frontend:ci vaccichain-python:ci; do
            docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null \
              || docker inspect --format='{{.Id}}' "$image"
          done | tee image-digests/SHA256SUMS

      - name: Upload container image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-image-digests
          path: image-digests/SHA256SUMS
          if-no-files-found: error

      - name: Attest container image build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: vaccichain-backend:ci
          subject-digest: ${{ steps.digest-backend.outputs.digest }}
          push-to-registry: false

  container-scan:
    name: Container vulnerability scanning
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build ./backend -t vaccichain-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t vaccichain-frontend:ci

      - name: Build python-service image
        run: docker build ./python-service -t vaccichain-python:ci

      - name: Run Trivy scan on backend
        id: scan-backend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-backend:ci
          format: sarif
          output: backend-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on frontend
        id: scan-frontend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-frontend:ci
          format: sarif
          output: frontend-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on python-service
        id: scan-python
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-python:ci
          format: sarif
          output: python-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de10bc158e62dc7a3c2da9b448f4 # v3.28.10
        with:
          sarif_file: |
            backend-trivy.sarif
            frontend-trivy.sarif
            python-trivy.sarif

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-scan-results
          path: |
            backend-trivy.sarif
            frontend-trivy.sarif
            python-trivy.sarif
          retention-days: 30

      - name: Fail on HIGH/CRITICAL vulnerabilities
        if: always()
        run: |
          if [[ "${{ steps.scan-backend.outcome }}" == "failure" || "${{ steps.scan-frontend.outcome }}" == "failure" || "${{ steps.scan-python.outcome }}" == "failure" ]]; then
            echo "One or more container images contain HIGH or CRITICAL vulnerabilities."
            exit 1
          fi

  container-scan-scheduled:
    name: Weekly container vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build ./backend -t vaccichain-backend:prod

      - name: Build frontend image
        run: docker build ./frontend -t vaccichain-frontend:prod

      - name: Build python-service image
        run: docker build ./python-service -t vaccichain-python:prod

      - name: Run Trivy scan on backend
        id: scan-scheduled-backend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-backend:prod
          format: table
          output: backend-scan.txt
          ignorefile: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on frontend
        id: scan-scheduled-frontend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-frontend:prod
          format: table
          output: frontend-scan.txt
          ignorefile: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on python-service
        id: scan-scheduled-python
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-python:prod
          format: table
          output: python-scan.txt
          ignorefile: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-trivy-scans
          path: |
            backend-scan.txt
            frontend-scan.txt
            python-scan.txt
          retention-days: 90

      - name: Fail on HIGH/CRITICAL vulnerabilities
        if: always()
        run: |
          if [[ "${{ steps.scan-scheduled-backend.outcome }}" == "failure" || "${{ steps.scan-scheduled-frontend.outcome }}" == "failure" || "${{ steps.scan-scheduled-python.outcome }}" == "failure" ]]; then
            echo "One or more scheduled container images contain HIGH or CRITICAL vulnerabilities."
            exit 1
          fi

  # Guardrail: fail if any workflow uses mutable action tags or grants
  # write scopes to jobs that should be read-only.
  workflow-permissions-check:
    name: Workflow permissions & action pinning check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify action pinning and least-privilege permissions
        run: python scripts/check_workflow_permissions.py
