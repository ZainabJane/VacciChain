name: CI

# Default to the most restrictive token scope; jobs opt in to extra scopes.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sunday at 00:00 UTC

jobs:
  contract:
    name: Rust / Soroban contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to sign build provenance attestations
      attestations: write  # required to publish build provenance attestations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Verify declared toolchain matches CI
        working-directory: contracts
        run: |
          # The pinned toolchain lives in contracts/rust-toolchain.toml (channel).
          # CI must install exactly that channel; fail otherwise.
          if [[ ! -f rust-toolchain.toml ]]; then
            echo "::error::contracts/rust-toolchain.toml is missing; the supported toolchain must be declared."
            exit 1
          fi
          DECLARED_CHANNEL="$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml | head -n1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          if [[ -z "${DECLARED_CHANNEL}" ]]; then
            echo "::error::Could not read 'channel' from contracts/rust-toolchain.toml."
            exit 1
          fi
          ACTIVE_CHANNEL="$(rustc --version | awk '{print $2}')"
          echo "Declared channel: ${DECLARED_CHANNEL}"
          echo "Active rustc:     ${ACTIVE_CHANNEL}"
          if [[ "${ACTIVE_CHANNEL}" != "${DECLARED_CHANNEL}"* ]]; then
            echo "::error::Installed Rust (${ACTIVE_CHANNEL}) does not match declared toolchain (${DECLARED_CHANNEL})."
            exit 1
          fi
          echo "Toolchain matches the declared channel."

      - name: Verify declared Soroban SDK / CLI versions
        working-directory: contracts
        run: |
          # Supported versions are declared in contracts/TOOLCHAIN.md and must
          # match what is pinned in Cargo.toml / Cargo.lock.
          if [[ ! -f TOOLCHAIN.md ]]; then
            echo "::error::contracts/TOOLCHAIN.md is missing; supported Soroban SDK/CLI versions must be documented."
            exit 1
          fi
          DECLARED_SDK="$(grep -E '^[[:space:]]*[-*]?[[:space:]]*Soroban SDK:' TOOLCHAIN.md | head -n1 | sed -E 's/.*Soroban SDK:[[:space:]]*`?([^`[:space:]]+)`?.*/\1/')"
          DECLARED_CLI="$(grep -E '^[[:space:]]*[-*]?[[:space:]]*Soroban CLI:' TOOLCHAIN.md | head -n1 | sed -E 's/.*Soroban CLI:[[:space:]]*`?([^`[:space:]]+)`?.*/\1/')"
          if [[ -z "${DECLARED_SDK}" || -z "${DECLARED_CLI}" ]]; then
            echo "::error::Could not read 'Soroban SDK:' / 'Soroban CLI:' from contracts/TOOLCHAIN.md."
            exit 1
          fi
          LOCKED_SDK="$(grep -A1 -E '^name = "soroban-sdk"$' Cargo.lock | grep -E '^version' | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Declared Soroban SDK: ${DECLARED_SDK} (locked: ${LOCKED_SDK})"
          echo "Declared Soroban CLI: ${DECLARED_CLI}"
          if [[ -z "${LOCKED_SDK}" ]]; then
            echo "::error::soroban-sdk not found in contracts/Cargo.lock."
            exit 1
          fi
          if [[ "${LOCKED_SDK}" != "${DECLARED_SDK}"* ]]; then
            echo "::error::Locked soroban-sdk (${LOCKED_SDK}) does not match declared version (${DECLARED_SDK})."
            exit 1
          fi
          echo "Soroban SDK version matches the declared policy."
=======

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Build WASM
        working-directory: contracts
        run: make build

      - name: Compute WASM artifact hash
        working-directory: contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Hash every deployable .wasm produced by the build.
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifacts/wasm-sha256.txt
          cat artifacts/wasm-sha256.txt

      - name: Upload WASM artifact hash
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-hash
          path: contracts/artifacts/wasm-sha256.txt
          retention-days: 90

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 90

      - name: Run contract tests
        working-directory: contracts
        run: cargo test

      # Issue #85: deterministic fuzz smoke corpus for public contract entry
      # points and serialization boundaries. Uses a fixed seed so CI is
      # reproducible; longer sessions run on the schedule below.
      - name: Fuzz smoke corpus (deterministic)
        working-directory: contracts
        env:
          PROPTEST_CASES: "256"
          PROPTEST_MAX_SHRINK_ITERS: "1024"
          FUZZ_SEED: "0x5eed85"
        run: cargo test --features fuzz --test fuzz_smoke -- --nocapture

      - name: Run storage lifecycle, migration, and resource baseline tests
        working-directory: contracts
        run: |
          cargo test --test storage_lifecycle -- --nocapture
          cargo test --test migration -- --nocapture
          cargo test --test resource_baseline -- --nocapture

      - name: Compare resource baselines against thresholds
        working-directory: contracts
        run: |
          cargo test --test resource_baseline -- --nocapture | tee resource-baseline-report.txt
          if grep -q "RESOURCE_REGRESSION" resource-baseline-report.txt; then
            echo "Material resource regression detected; see resource-baseline-report.txt"
            exit 1
          fi

      - name: Upload resource baseline comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-resource-baseline
          path: contracts/resource-baseline-report.txt

      - name: Run contract tests with coverage
        working-directory: contracts
        run: |
          cargo install cargo-tarpaulin
          make test-coverage

      - name: Upload Contract Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: contracts/tarpaulin-report.xml
          flags: contracts
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Dependency audit (cargo-audit)
        working-directory: contracts
        run: cargo audit | tee audit-report.txt

      - name: Dependency advisories and policy (cargo-deny)
        working-directory: contracts
        run: cargo deny --all-features check advisories bans licenses sources | tee -a audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-audit-report
          path: contracts/audit-report.txt

  # Reproducible WASM build verification (Backlog #93).
  # Rebuilds the contract WASM on a clean runner using the pinned toolchain,
  # computes its SHA-256 hash, and compares it to the hash produced by the
  # primary `contract` job. Fails if the hashes differ.
  #
  # Known nondeterministic inputs (documented per acceptance criteria):
  #   - Rust toolchain is pinned via rust-toolchain.toml (channel + components).
  #   - Cargo dependencies are pinned via contracts/Cargo.lock.
  #   - The build is expected to be byte-for-byte reproducible; if a future
  #     toolchain introduces nondeterminism, record it here and in
  #     contracts/REPRODUCIBLE_BUILD.md.
  reproducible-wasm:
    name: Reproducible WASM build
    runs-on: ubuntu-latest
    needs: [contract]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM (clean runner)
        working-directory: contracts
        run: make build

      - name: Compute WASM artifact hash
        working-directory: contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -print0 \
            | sort -z \
            | xargs -0 sha256sum > artifacts/wasm-sha256.txt
          cat artifacts/wasm-sha256.txt

      - name: Download primary build hash
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm-hash
          path: primary-hash

      - name: Compare hashes
        run: |
          set -euo pipefail
          echo "Primary build hash:"
          cat primary-hash/wasm-sha256.txt
          echo "Reproduced build hash:"
          cat contracts/artifacts/wasm-sha256.txt
          if ! diff -u primary-hash/wasm-sha256.txt contracts/artifacts/wasm-sha256.txt; then
            echo "::error::WASM artifact hashes differ between builds; the build is not reproducible."
            exit 1
          fi
          echo "WASM artifact hashes match — build is reproducible."

      - name: Upload reproduced WASM hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-hash-reproduced
          path: contracts/artifacts/wasm-sha256.txt
          retention-days: 90

  backend:
    name: Node.js backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: OpenAPI docs drift check (#43)
        working-directory: backend
        run: npm run docs:check

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: backend/coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Dependency audit
        working-directory: backend
        run: npm audit --audit-level=high | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-audit-report
          path: backend/audit-report.txt

  frontend:
    name: Node.js frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check locale key parity
        working-directory: frontend
        run: node scripts/check-locale-parity.js

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-audit-report
          path: frontend/audit-report.txt

  python:
    name: Python analytics service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        working-directory: python-service
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: python-service
        run: flake8 .

      - name: Run tests with coverage
        working-directory: python-service
        run: pytest --cov --cov-report=xml

      - name: Upload Python Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: python-service/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency audit
        working-directory: python-service
        run: pip-audit -r requirements.txt | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-audit-report
          path: python-service/audit-report.txt

  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high | tee audit-report.txt

      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit-report
          path: backend/audit-report.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high | tee audit-report.txt

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit-report
          path: frontend/audit-report.txt

      - name: Install Rust + cargo-audit
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Contract dependency audit
        working-directory: contracts
        run: cargo audit | tee audit-report.txt

      - name: Upload contract audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-audit-report
          path: contracts/audit-report.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python dependency audit
        working-directory: python-service
        run: pip-audit -r requirements.txt | tee audit-report.txt

      - name: Upload python audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-report
          path: python-service/audit-report.txt

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt check
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(infra/envs/*/ infra/modules/*/)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "No Terraform directories found."
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            echo "::group::fmt ${dir}"
            terraform fmt -check -recursive "${dir}"
            echo "::endgroup::"
          done

      - name: Terraform validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(infra/envs/*/ infra/modules/*/)
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "No Terraform directories found."
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            echo "::group::validate ${dir}"
            (cd "${dir}" && terraform init -backend=false -input=false && terraform validate)
            echo "::endgroup::"
          done

  # Gate job: the single stable required status check for branch protection.
  # Configure "ci-required" as the sole required status check in
  # Settings → Branches → Branch protection rules for `main`.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [contract, reproducible-wasm, backend, frontend, python]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [[ "${{ needs.contract.result }}" != "success" || \
                "${{ needs.reproducible-wasm.result }}" != "success" || \
                "${{ needs.backend.result }}"  != "success" || \
                "${{ needs.frontend.result }}"  != "success" || \
                "${{ needs.python.result }}"    != "success" ]]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All required jobs passed."

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required to sign build provenance attestations
      attestations: write  # required to publish build provenance attestations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build ./backend -t vaccichain-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t vaccichain-frontend:ci

      - name: Build python-service image
        run: docker build ./python-service -t vaccichain-python:ci

  terraform-scan:
    name: Terraform / IaC dependency and misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan on infra
        id: scan-infra
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: infra-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy config scan on staging
        id: scan-staging
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: config
          scan-ref: staging
          format: sarif
          output: staging-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Upload Trivy IaC results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            infra-trivy.sarif
            staging-trivy.sarif

      - name: Upload IaC scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-scan-results
          path: |
            infra-trivy.sarif
            staging-trivy.sarif
          retention-days: 30

      - name: Fail on HIGH/CRITICAL findings
        if: always()
        run: |
          if [[ "${{ steps.scan-infra.outcome }}" == "failure" || "${{ steps.scan-staging.outcome }}" == "failure" ]]; then
            echo "One or more Terraform/IaC targets contain HIGH or CRITICAL findings."
            exit 1
          fi

  container-scan:
    name: Container vulnerability scanning
    runs-on: ubuntu-latest
    needs: [docker, terraform-scan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build ./backend -t vaccichain-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t vaccichain-frontend:ci

      - name: Build python-service image
        run: docker build ./python-service -t vaccichain-python:ci

      - name: Run Trivy scan on backend
        id: scan-backend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-backend:ci
          format: sarif
          output: backend-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on frontend
        id: scan-frontend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-frontend:ci
          format: sarif
          output: frontend-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on python-service
        id: scan-python
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-python:ci
          format: sarif
          output: python-trivy.sarif
          severity: HIGH,CRITICAL
          ignorefile: .trivyignore
          exit-code: 1
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de10bc158e62dc7a3c2da9b448f4 # v3.28.10
        with:
          sarif_file: |
            backend-trivy.sarif
            frontend-trivy.sarif
            python-trivy.sarif

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-scan-results
          path: |
            backend-trivy.sarif
            frontend-trivy.sarif
            python-trivy.sarif
          retention-days: 30

      - name: Fail on HIGH/CRITICAL vulnerabilities
        if: always()
        run: |
          if [[ "${{ steps.scan-backend.outcome }}" == "failure" || "${{ steps.scan-frontend.outcome }}" == "failure" || "${{ steps.scan-python.outcome }}" == "failure" ]]; then
            echo "One or more container images contain HIGH or CRITICAL vulnerabilities."
            exit 1
          fi

  # Issue #85: longer fuzz sessions on the weekly schedule (and on demand).
  fuzz-scheduled:
    name: Scheduled long fuzz session
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-fuzz-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Long fuzz session (extended case counts)
        working-directory: contracts
        env:
          PROPTEST_CASES: "100000"
          PROPTEST_MAX_SHRINK_ITERS: "10000"
          FUZZ_SEED: "0x5eed85"
        run: cargo test --features fuzz --test fuzz_smoke -- --nocapture

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-session-artifacts
          path: |
            contracts/fuzz/artifacts
            contracts/proptest-regressions
          retention-days: 90

  container-scan-scheduled:
    name: Weekly container vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build ./backend -t vaccichain-backend:prod

      - name: Build frontend image
        run: docker build ./frontend -t vaccichain-frontend:prod

      - name: Build python-service image
        run: docker build ./python-service -t vaccichain-python:prod

      - name: Run Trivy scan on backend
        id: scan-scheduled-backend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-backend:prod
          format: table
          output: backend-scan.txt
          ignorefile: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on frontend
        id: scan-scheduled-frontend
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-frontend:prod
          format: table
          output: frontend-scan.txt
          ignorefile: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Run Trivy scan on python-service
        id: scan-scheduled-python
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: vaccichain-python:prod
          format: table
          output: python-scan.txt
          ignorefile: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-trivy-scans
          path: |
            backend-scan.txt
            frontend-scan.txt
            python-scan.txt
          retention-days: 90

      - name: Fail on HIGH/CRITICAL vulnerabilities
        if: always()
        run: |
          if [[ "${{ steps.scan-scheduled-backend.outcome }}" == "failure" || "${{ steps.scan-scheduled-frontend.outcome }}" == "failure" || "${{ steps.scan-scheduled-python.outcome }}" == "failure" ]]; then
            echo "One or more scheduled container images contain HIGH or CRITICAL vulnerabilities."
            exit 1
          fi

  # Guardrail: fail if any workflow uses mutable action tags or grants
  # write scopes to jobs that should be read-only.
  workflow-permissions-check:
    name: Workflow permissions & action pinning check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify action pinning and least-privilege permissions
        run: python scripts/check_workflow_permissions.py
