[package]
name = "vaccichain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to an exact version so the audited WASM hash is reproducible.
# Audit revision: soroban-sdk =22.0.0 (see audit report for pinned source revision and WASM hash).
soroban-sdk = { version = "=22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
proptest = "1.4"
arbitrary = { version = "1.3", features = ["derive"] }

# Release profile is part of the audit build configuration.
# These settings are documented in the audit scope and must not change without
# re-auditing, as they affect the produced WASM hash:
#   - overflow-checks = true  (arithmetic safety)
#   - panic = "abort"         (no unwinding in WASM)
#   - lto = true              (link-time optimization for deterministic output)
#   - codegen-units = 1       (deterministic codegen)
#   - opt-level = "z"         (size optimization)
#   - strip = "symbols"       (symbol stripping)
#   - debug = 0               (no debug info)
#   - debug-assertions = false
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true