[package]
name = "vaccichain"
version = "0.1.0"
edition = "2021"
# Supported toolchain policy (see contracts/README.md and docs/contract-upgrade.md):
#   - Rust: 1.81.0 (pinned via rust-toolchain.toml; MSRV 1.81)
#   - Soroban SDK: 22.0.0 (pinned below; do not use caret ranges)
#   - Stellar CLI: 22.0.0
# Dependency upgrades require tests, resource/GAS comparison, and release-note updates.
rust-version = "1.81"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned Soroban SDK version. Upgrades must follow the dependency upgrade
# review policy in contracts/README.md and docs/contract-upgrade.md.
soroban-sdk = { version = "=22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
proptest = "1.4"
arbitrary = { version = "1.3", features = ["derive"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true