global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ── VacciChain service health checks ──────────────────────────────────────
  - job_name: vaccichain_health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - http://backend:4000/health        # Backend (Node.js)
          - http://python-service:8001/health # Analytics (FastAPI)
        labels:
          env: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── Frontend availability ──────────────────────────────────────────────────
  - job_name: vaccichain_frontend
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:80
        labels:
          env: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── Staging / production endpoints (override via env vars or edit targets) ─
  - job_name: vaccichain_staging
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets:
          - ${STAGING_BACKEND_URL:-https://staging.vaccichain.example.com}/health
        labels:
          env: staging
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── Blackbox exporter self-monitoring ─────────────────────────────────────
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # ── ECS task autoscaling / capacity metrics ───────────────────────────────
  # ECS and Application Auto Scaling metrics live in CloudWatch, not on the
  # tasks themselves. They are bridged into Prometheus by the CloudWatch
  # exporter (yet-another-cloudwatch-exporter) running as the `cloudwatch`
  # service. Capacity alarms (CPU/memory high, min/max task count reached,
  # backend/database concurrency guardrails) are defined in CloudWatch and
  # mirrored in /etc/prometheus/alerts.yml so Alertmanager sees them too.
  # See monitoring/README.md ("ECS autoscaling & capacity alarms") for the
  # per-service scaling policy definitions and load-test procedure.
  - job_name: ecs_cloudwatch
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudwatch:9106"]
        labels:
          env: local
          source: cloudwatch

  # ── ECS container-level resource usage (cAdvisor) ─────────────────────────
  # Provides per-task CPU/memory so scaling decisions can be validated
  # against the CloudWatch-derived metrics above.
  - job_name: ecs_cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          env: local
          source: cadvisor

  # ── Backup job metrics (backup_* emitted by backup.sh) ────────────────────
  # backup.sh writes its metrics to the node_exporter textfile collector
  # directory; node_exporter exposes them on /metrics.
  - job_name: backup_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: local
          component: backup
    relabel_configs:
      # Keep only backup_* series so this job stays focused on backup health.
      - source_labels: [__name__]
        regex: backup_.*
        action: keep

  # ── Backup job metrics pushed via Pushgateway (optional) ──────────────────
  # Enable if backup.sh runs on hosts without node_exporter and pushes
  # backup_* metrics to the Pushgateway instead.
  - job_name: backup_pushgateway
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          env: local
          component: backup
    relabel_configs:
      - source_labels: [__name__]
        regex: backup_.*
        action: keep
